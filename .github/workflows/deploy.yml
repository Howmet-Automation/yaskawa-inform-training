name: Build and deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Inspect dependency advisories and capture generated lockfile
        shell: bash
        run: |
          npm audit --json > /tmp/training-audit.json || true
          npm audit --omit=dev --json > /tmp/training-audit-runtime.json || true
          node -e 'for (const name of ["training-audit","training-audit-runtime"]) { const report=JSON.parse(require("node:fs").readFileSync("/tmp/"+name+".json","utf8")); console.log("TRAINING_AUDIT "+name+" "+JSON.stringify({error:report.error,metadata:report.metadata,vulnerabilities:report.vulnerabilities})); }'
          node -e 'const s=require("node:fs").readFileSync("package-lock.json","utf8"); for(let i=0;i<s.length;i+=2500) console.log("TRAINING_LOCK_CHUNK "+JSON.stringify(s.slice(i,i+2500)));'
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
        env:
          TRAINING_REVIEW_CAPTURE: '1'
      - name: Upload browser review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: module-01-browser-review
          path: test-results/
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
